services:
  postgres:
    image: postgres:16-alpine
    container_name: pathfinder_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pathfinder
      POSTGRES_USER: pathfinder_user
      POSTGRES_PASSWORD: pathfinder_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathfinder_user -d pathfinder"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: pathfinder_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/pathfinder_neo4j
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p pathfinder_neo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  neo4j_data:
